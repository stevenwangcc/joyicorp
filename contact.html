<body>

<div id="navbar-placeholder"></div>


<!-- ===================================================
     Page Header
     =================================================== -->
<header class="page-header">
  <div class="page-header-content">
    <div class="breadcrumb">
      <a href="index.html">首頁</a> &rsaquo; 聯繫資訊
    </div>
    <h1>聯繫資訊</h1>
    <p>初次諮詢免費（30 分鐘），立即預約，讓我們為您的企業找到最佳方案！</p>
  </div>
</header>


<!-- ===================================================
     Contact Section
     =================================================== -->
<section class="section section-alt">
  <div class="container">
    <div class="contact-grid">

      <!-- ── Contact Form ── -->
      <div>
        <div class="form-section-title">
          <i class="fas fa-paper-plane" style="color:var(--accent);margin-right:10px;"></i>填寫諮詢表單
        </div>

        <!--
          ╔══════════════════════════════════════════════════════════╗
          ║  Formspree 表單說明                                      ║
          ║  1. 前往 https://formspree.io 免費註冊帳號               ║
          ║  2. 建立新表單，取得您的 Form ID（格式：xxxxxxxx）       ║
          ║  3. 將下方 action 中的 YOUR_FORM_ID 替換為您的 Form ID   ║
          ║     例如：https://formspree.io/f/abcd1234               ║
          ╚══════════════════════════════════════════════════════════╝
        -->
        <form
          id="contact-form"
          action="https://formspree.io/f/xvzyowwr"
          method="POST"
          novalidate
        >
          <div class="form-row">
            <div class="form-group">
              <label for="name">姓名<span class="req">*</span></label>
              <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                placeholder="請輸入您的姓名"
                required
              />
            </div>
            <div class="form-group">
              <label for="company">公司名稱<span class="req">*</span></label>
              <input
                type="text"
                id="company"
                name="company"
                class="form-control"
                placeholder="請輸入公司名稱"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="phone">聯絡電話</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                class="form-control"
                placeholder="例：0912-345-678"
              />
            </div>
            <div class="form-group">
              <label for="email">電子郵件<span class="req">*</span></label>
              <input
                type="email"
                id="email"
                name="_replyto"
                class="form-control"
                placeholder="example@company.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="topic">諮詢主題<span class="req">*</span></label>
            <select id="topic" name="topic" class="form-control" required>
              <option value="" disabled selected>請選擇諮詢主題</option>
              <option value="企業管理顧問">企業管理顧問</option>
              <option value="AI 人機協作方案">AI 人機協作方案</option>
              <option value="策略諮詢">策略諮詢</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">諮詢內容<span class="req">*</span></label>
            <textarea
              id="message"
              name="message"
              class="form-control"
              rows="5"
              placeholder="請簡述您的企業背景、目前面臨的挑戰或想了解的服務內容，讓我們能在諮詢前有所準備。"
              required
            ></textarea>
          </div>

          <!-- Formspree 防垃圾郵件設定 -->
          <input type="hidden" name="_subject" value="【謙溢管理顧問】新諮詢表單" />
          <input type="text" name="_gotcha" style="display:none;" />

          <button type="submit" class="btn btn-primary btn-submit">
            <i class="fas fa-paper-plane" style="margin-right:8px;"></i>送出諮詢
          </button>

        </form>

        <!-- 表單送出成功訊息 -->
        <div id="form-success" class="success-msg" role="alert">
          <i class="fas fa-check-circle" style="font-size:1.3rem;color:#2e7d32;flex-shrink:0;"></i>
          <span>
            <strong>感謝您的留言！</strong><br>
            我們已收到您的諮詢，將於 1–2 個工作天內與您聯繫。
          </span>
        </div>

      </div><!-- /form column -->


      <!-- ── Contact Info Panel ── -->
      <div>
        <div class="contact-info-panel">
          <div class="info-panel-title">
            <i class="fas fa-map-marker-alt" style="color:var(--accent);margin-right:8px;"></i>聯繫資訊
          </div>

          <div class="info-row">
            <div class="info-icon"><i class="fas fa-envelope"></i></div>
            <div class="info-text">
              <div class="lbl">電子郵件</div>
              <div class="val">
                <a href="mailto:stevenwang.cc@gmail.com">stevenwang.cc@gmail.com</a>
              </div>
            </div>
          </div>

          <div class="info-row">
            <div class="info-icon"><i class="fas fa-phone"></i></div>
            <div class="info-text">
              <div class="lbl">聯絡電話</div>
              <div class="val">（待補）</div>
            </div>
          </div>

          <div class="info-row">
            <div class="info-icon"><i class="fas fa-map-marker-alt"></i></div>
            <div class="info-text">
              <div class="lbl">辦公地址</div>
              <div class="val">（待補）</div>
            </div>
          </div>

          <div class="info-row">
            <div class="info-icon"><i class="fas fa-clock"></i></div>
            <div class="info-text">
              <div class="lbl">服務時間</div>
              <div class="val">週一至週五<br>9:00 – 18:00</div>
            </div>
          </div>

          <div class="info-cta-box">
            <div class="cta-tag">限時優惠</div>
            <p>
              <strong>初次諮詢完全免費（30 分鐘）</strong><br>
              讓我們先了解您的企業現況，<br>
              再為您規劃最適合的方案。
            </p>
          </div>
        </div>
      </div><!-- /info panel -->

    </div><!-- /contact-grid -->
  </div>
</section>

    </p>
    <a href="mailto:stevenwang.cc@gmail.com" class="btn btn-accent-full">

    </a>
  </div>
</section>
